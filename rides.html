<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alison Alfaro Arias">
    <title>Aventones - New Ride</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="rides.html" class="active">Rides</a></li>
                <li><a href="bookings.html">Bookings</a></li>
            </ul>
            <div class="search-bar">
                <input type="text" placeholder="Search...">
                <button><img src="user.png" alt="User"></button>
            </div>
        </nav>
        <h1>AVENTONES</h1>
    </header>
    <main>
        <h2>New Ride</h2>
        <form action="submit_ride.html" method="post">
            <div class="form-group">
                <label for="departure">Departure from</label>
                <input type="text" id="departure" name="departure" required>
            </div>
            <div class="form-group">
                <label for="arrival">Arrive To</label>
                <input type="text" id="arrival" name="arrival" required>
            </div>
            <div class="form-group">
                <label>Days</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="days" value="Mon"> Mon</label>
                    <label><input type="checkbox" name="days" value="Tue"> Tue</label>
                    <label><input type="checkbox" name="days" value="Wed"> Wed</label>
                    <label><input type="checkbox" name="days" value="Thu"> Thu</label>
                    <label><input type="checkbox" name="days" value="Fri"> Fri</label>
                    <label><input type="checkbox" name="days" value="Sat"> Sat</label>
                    <label><input type="checkbox" name="days" value="Sun"> Sun</label>
                </div>
            </div>
            <div class="form-group">
                <label for="time">Time</label>
                <select id="time" name="time">
                    <option value="10:00 AM">10:00 am</option>
                    <!-- Add more options as needed -->
                </select>
            </div>
            <div class="form-group">
                <label for="seats">Seats</label>
                <input type="number" id="seats" name="seats" min="1" max="10" value="2" required>
            </div>
            <div class="form-group">
                <label for="fee">Fee</label>
                <input type="number" id="fee" name="fee" min="0" value="15" required>
            </div>
            <fieldset>
                <legend>Vehicle Details</legend>
                <div class="form-group">
                    <label for="make">Make</label>
                    <select id="make" name="make">
                        <option value="Nissan">Nissan</option>
                        <!-- Add more options as needed -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="model">Model</label>
                    <input type="text" id="model" name="model" placeholder="Car Model" required>
                </div>
                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" name="year" min="1900" max="2024" value="2020" required>
                </div>
            </fieldset>
            <div class="form-buttons">
                <button type="submit" class="create">Create</button>
                <a href="rides.html" class="cancel">Cancel</a>
            </div>
        </form>
    </main>
    <footer>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="rides.html">Rides</a></li>
                <li><a href="bookings.html">Bookings</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
        <p>&copy; Aventones.com</p>
    </footer>
</body>

</html>
