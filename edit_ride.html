<!DOCTYPE html>
<html lang="es" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" >
    <meta name="autor" content="Alison Alfaro Arias">
    <title> AVENTONES- EDIT RIDE</title>
    <link rel="stylesheet" href="Edit_ride.css">
</head>

<body>
    <section class="principal">
        <div class="imagen">
            <img src="logo.png" alt="logo" style="width: 100px;">
        </div>
        <div class="text">
            <h1>AVENTONES</h1>
        </div>
    </section>
    <div class="principal">
        <div class="container">
            <div class="row">
                <nav class="cont">
                    <a href="home.html" class="nav-link">Home </a>&nbsp;&nbsp;
                    <a href="rides.html" class="nav-link">Rides </a>&nbsp;&nbsp;
                    <a href="Booking.html" class="nav-link">Bookings </a>&nbsp;&nbsp;
                    <input type="text" class="search-input" placeholder="Search...">&nbsp;&nbsp;
                    <img src="user.png" width="25" alt="user_icon">
                </nav>
            </div>
        </div>
    </div>
    <section class="ride">
        <div class="rid">
            <h1 class="textos"> Edit Ride </h1>
            <p class="line">_____________________</p>
            <fieldset class="prin">
                <p class="dep"> Departure from </p>
                <input type="text" class="inp" placeholder="Quesada">
                <p class="arr"> Arrive To</p>
                <input type="text" class="inp" placeholder="Zarcero">
            </fieldset>
            <fieldset class="dias">
                <p class="day"> Days </p>
                <input type="checkbox" class="M">
                <p>Mon</p>
                <input type="checkbox" class="T">
                <p>Tue</p>
                <input type="checkbox" class="W">
                <p>Wed</p>
                <input type="checkbox" class="Th">
                <p>Thu</p>
                <input type="checkbox" class="F">
                <p>Fri</p>
                <input type="checkbox" class="S">
                <p>Sat</p>
                <input type="checkbox" class="Su">
                <p>Sun</p>
            </fieldset>
            <fieldset class="tiempo">
                <p class="time"> Time </p>
                <select class="time">
                    <option value="SC" disabled selected>10:00 am</option>
                    <option value="LF">11:00 am</option>
                    <option value="AN">1:00 pm</option>
                </select>
                <p class="sea">Seats</p>
                <input type="number" class="sea">
                <p class="fee"> Fee </p>
                <input type="number" class="fee">
            </fieldset>
            <div>
                <p> Vehicle Details</p>
                <fieldset class="informacion">
                    <p> Make </p>
                    <select class="inpT">
                        <option value="SC" disabled selected>Nissan</option>
                        <option value="LF">Toyota</option>
                        <option value="AN">Jeep</option>
                    </select>
                    <p> Model </p>
                    <input type="text" class="model" placeholder="Pathfinder">
                    <p> Year </p>
                    <input type="number" id="anio" class="year" name="anio" min="2020" max="2100" step="1">
                </fieldset>
            </div>
    </section>
    <div class="boton">
        <div class="botones">
            <a href="#" class="nva"> Cancel </a>
            <button class="nvs"> Save </button>
        </div>
    </div>
    <br><br></br>
    <footer class="footer">
        <div class="container">
            <nav>
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="rides.html">Rides</a></li>
                    <li><a href="Booking.html">Bookings</a></li>
                    <li><a href="settings.html">Settings</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                </ul>
            </nav>
            <p>&copy; Aventones.com</p>
        </div>
    </footer>
</body>

</html>
